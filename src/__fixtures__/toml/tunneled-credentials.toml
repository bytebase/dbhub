# A network source that carries database and SSH credentials
# Used for testing what the sources API exposes and what it withholds.
# lazy = true registers the source without connecting, so no server is needed.

[[sources]]
id = "tunneled_pg"
description = "Reached through a bastion"
dsn = "postgres://app_user:db-secret-password@db.internal:5433/appdb"
lazy = true
ssh_host = "bastion.example.com"
ssh_port = 2222
ssh_user = "deploy"
ssh_password = "ssh-secret-password"
