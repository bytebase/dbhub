name: Run Tests

on:
  pull_request:
    branches: [ main ]
    # Run when PR is opened, synchronized, or reopened
    types: [opened, synchronize, reopened]
  # Also allow manual triggering
  workflow_dispatch:

jobs:
  tests:
    # One job per suite, run in parallel. The job names are the status check
    # names ("Unit Tests", "Integration Tests") — keep them stable, branch
    # protection may require them.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit Tests
            script: test:unit
            docker: false
          - name: Integration Tests
            script: test:integration
            docker: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Integration tests start database containers with Testcontainers
      - name: Verify Docker is available
        if: matrix.docker
        run: |
          docker --version
          docker info

      # pnpm must be on PATH before setup-node can use the pnpm store cache
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ${{ matrix.name }}
        run: pnpm ${{ matrix.script }}
