<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Aurora Bloom — DBHub logo palette</title>
  <desc id="desc">Starfish gradient: Mint #B2FCCB at 0%, Turquoise #19DECD at 25%, Blue #2AA1FE at 62%, Violet #955BFE at 100%. Supporting colors: Ink #19253C for eyes and smile, Zinc #323236 for the wordmark on light backgrounds, White #FFFFFF for the wordmark on dark backgrounds.</desc>
  <rect width="960" height="580" rx="16" fill="#FAFAFA"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#323236">
    <text x="40" y="62" font-size="30" font-weight="600" letter-spacing="-0.8">Aurora Bloom</text>
    <text x="920" y="60" text-anchor="end" font-size="17" fill="#52525B">DBHub · Logo palette</text>
    <text x="40" y="114" font-size="16" fill="#52525B">Starfish gradient</text>
    <rect x="40" y="132" width="208" height="176" rx="8" fill="#B2FCCB"/>
    <text x="40" y="342" font-size="21" font-weight="600">Mint</text>
    <text x="248" y="342" text-anchor="end" font-size="15" fill="#52525B">0%</text>
    <text x="40" y="370" font-size="19" font-family="SFMono-Regular, Consolas, monospace" fill="#52525B">#B2FCCB</text>
    <rect x="264" y="132" width="208" height="176" rx="8" fill="#19DECD"/>
    <text x="264" y="342" font-size="21" font-weight="600">Turquoise</text>
    <text x="472" y="342" text-anchor="end" font-size="15" fill="#52525B">25%</text>
    <text x="264" y="370" font-size="19" font-family="SFMono-Regular, Consolas, monospace" fill="#52525B">#19DECD</text>
    <rect x="488" y="132" width="208" height="176" rx="8" fill="#2AA1FE"/>
    <text x="488" y="342" font-size="21" font-weight="600">Blue</text>
    <text x="696" y="342" text-anchor="end" font-size="15" fill="#52525B">62%</text>
    <text x="488" y="370" font-size="19" font-family="SFMono-Regular, Consolas, monospace" fill="#52525B">#2AA1FE</text>
    <rect x="712" y="132" width="208" height="176" rx="8" fill="#955BFE"/>
    <text x="712" y="342" font-size="21" font-weight="600">Violet</text>
    <text x="920" y="342" text-anchor="end" font-size="15" fill="#52525B">100%</text>
    <text x="712" y="370" font-size="19" font-family="SFMono-Regular, Consolas, monospace" fill="#52525B">#955BFE</text>
    <path d="M40 408H920" stroke="#000000" stroke-opacity="0.08"/>
    <text x="40" y="446" font-size="16" fill="#52525B">Face and wordmark</text>
    <rect x="40" y="470" width="56" height="56" rx="8" fill="#19253C" stroke="#000000" stroke-opacity="0.08"/>
    <text x="112" y="490" font-size="19" font-weight="600">Ink</text>
    <text x="112" y="517" font-size="17" font-family="SFMono-Regular, Consolas, monospace" fill="#52525B">#19253C</text>
    <text x="112" y="542" font-size="15" fill="#52525B">Eyes and smile</text>
    <rect x="344" y="470" width="56" height="56" rx="8" fill="#323236" stroke="#000000" stroke-opacity="0.08"/>
    <text x="416" y="490" font-size="19" font-weight="600">Zinc</text>
    <text x="416" y="517" font-size="17" font-family="SFMono-Regular, Consolas, monospace" fill="#52525B">#323236</text>
    <text x="416" y="542" font-size="15" fill="#52525B">On light backgrounds</text>
    <rect x="648" y="470" width="56" height="56" rx="8" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.08"/>
    <text x="720" y="490" font-size="19" font-weight="600">White</text>
    <text x="720" y="517" font-size="17" font-family="SFMono-Regular, Consolas, monospace" fill="#52525B">#FFFFFF</text>
    <text x="720" y="542" font-size="15" fill="#52525B">On dark backgrounds</text>
  </g>
</svg>
